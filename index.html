<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <title>ATLAS — Assistente Virtual</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b18;
      --cyan: #46e7ff;
      --blue: #247bff;
      --muted: #9bb2cf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(20, 94, 190, .22), transparent 36%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 212, 255, .07), transparent 50%),
        var(--bg);
      color: #edf8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 76px 1fr 76px; }
    .rail { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 10px; }
    .rail.right { justify-content: flex-end; }
    .nav-button {
      width: 46px; height: 46px; border-radius: 15px;
      border: 1px solid rgba(112, 195, 255, .18);
      background: rgba(10, 28, 54, .68); color: #b7d8f7;
      display: grid; place-items: center; cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }
    .nav-button:hover, .nav-button:focus-visible {
      border-color: var(--cyan); background: rgba(27, 103, 170, .3); transform: translateY(-2px);
      outline: none;
    }
    .nav-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 16px; }
    .eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .28em; font-size: 11px; margin-bottom: 22px; }
    .core-wrap { position: relative; width: clamp(190px, 30vw, 310px); aspect-ratio: 1; display: grid; place-items: center; margin-bottom: 28px; }
    .orbit { position: absolute; inset: 0; border: 1px solid rgba(70, 231, 255, .24); border-radius: 50%; animation: rotate 18s linear infinite; }
    .orbit::before, .orbit::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
    .orbit::before { top: 13%; left: 19%; }
    .orbit::after { right: 9%; bottom: 27%; width: 5px; height: 5px; }
    .orbit.two { inset: 15%; border-color: rgba(36, 123, 255, .42); animation-direction: reverse; animation-duration: 12s; }
    .core {
      width: 66%; aspect-ratio: 1; border-radius: 50%;
      display: grid; place-items: center; position: relative;
      background: radial-gradient(circle at 36% 28%, #7ff4ff 0%, #20bce9 17%, #1265d6 48%, #071a45 76%);
      border: 1px solid rgba(138, 245, 255, .9);
      box-shadow: 0 0 25px rgba(36, 193, 255, .55), 0 0 75px rgba(20, 112, 255, .32), inset 0 0 25px rgba(151, 247, 255, .32);
    }
    .core::before { content: ""; position: absolute; inset: 9%; border: 1px solid rgba(205, 252, 255, .42); border-radius: 50%; }
    .core-mark { font-size: clamp(32px, 6vw, 58px); font-weight: 300; letter-spacing: -.1em; padding-right: .1em; text-shadow: 0 0 18px rgba(255,255,255,.6); }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 52px); font-weight: 600; letter-spacing: .26em; padding-left: .26em; }
    .subtitle { margin: 12px 0 0; color: #a9c5e4; font-size: 14px; letter-spacing: .04em; }
    .status { margin-top: 30px; display: inline-flex; align-items: center; gap: 9px; color: #9ab8d6; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #55f0c1; box-shadow: 0 0 12px #55f0c1; }
    .hint { margin-top: 10px; font-size: 11px; color: #607d9f; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @media (max-width: 600px) {
      .app { grid-template-columns: 54px 1fr 54px; }
      .rail { padding: 18px 4px; gap: 12px; }
      .nav-button { width: 38px; height: 38px; border-radius: 12px; }
      .eyebrow { letter-spacing: .16em; font-size: 9px; }
      .subtitle { max-width: 220px; line-height: 1.6; }
    }
    /* Em telas muito largas, prioriza a experiência visual de TV. */
    @media (min-width: 1600px) and (min-height: 800px) {
      .app { grid-template-columns: 0 1fr 0; }
      .rail { visibility: hidden; padding: 0; }
      .core-wrap { width: min(34vh, 420px); }
      h1 { font-size: 64px; }
      .subtitle { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Navegação principal">
      <button class="nav-button" aria-label="Início" title="Início"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/></svg></button>
      <button class="nav-button" aria-label="Conversas" title="Conversas"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"/><path d="M8 10h8M8 14h5"/></svg></button>
      <button class="nav-button" aria-label="Configurações" title="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"/></svg></button>
    </nav>
    <main>
      <div class="eyebrow">Sistema de assistência inteligente</div>
      <div class="core-wrap" aria-label="Núcleo visual ATLAS">
        <div class="orbit"></div>
        <div class="orbit two"></div>
        <div class="core"><span class="core-mark">A</span></div>
      </div>
      <h1>ATLAS</h1>
      <p class="subtitle">Seu assistente. Seu universo.</p>
      <div class="status"><span class="status-dot"></span><span>Sistema visual inicializado</span></div>
      <div class="hint">Interface inicial · versão 0.1</div>
    </main>
    <nav class="rail right" aria-label="Ferramentas">
      <button class="nav-button" aria-label="Áudio" title="Áudio"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button>
      <button class="nav-button" aria-label="Ajuda" title="Ajuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.2 1.1-1.9 1.4-1.9 3M12 17h.01"/></svg></button>
    </nav>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
